name: Dependency audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: |
          npm audit --json > /tmp/audit.json || true
          node -e "
            const report = require('/tmp/audit.json')
            // Known, accepted advisories (see AGENTS.md):
            // prototype pollution GHSA-4r6h-8v6p-xvw6, ReDoS GHSA-5pgg-2g8v-p4x9
            // (both on the npm-line xlsx build), plus the sprintf-js DoS
            // GHSA-hp3w-g68c-fv3c via mammoth's argparse CLI path, which is never
            // imported by the client bundle (verified: no sprintf/argparse in dist)
            // and has no npm-line fix without a breaking mammoth downgrade.
            const allowed = new Set([
              'https://github.com/advisories/GHSA-4r6h-8v6p-xvw6',
              'https://github.com/advisories/GHSA-5pgg-2g8v-p4x9',
              'https://github.com/advisories/GHSA-hp3w-g68c-fv3c',
            ])
            const urls = new Set()
            for (const v of Object.values(report.vulnerabilities || {})) {
              for (const a of v.via || []) if (typeof a === 'object' && a.url) urls.add(a.url)
            }
            const blocking = [...urls].filter((u) => !allowed.has(u))
            if (blocking.length) {
              console.error('Blocking advisories: ' + blocking.join(', '))
              process.exit(1)
            }
            console.log('Audit OK (' + (urls.size || 'no') + ' advisory(ies), all allowlisted)')
          "
