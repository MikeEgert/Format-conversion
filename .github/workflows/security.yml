name: Dependency audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: |
          npm audit --json > /tmp/audit.json || true
          node -e "
            const report = require('/tmp/audit.json')
            // No accepted advisories right now (see AGENTS.md). xlsx comes from
            // the SheetJS CDN (0.20.3), which clears the npm-line advisories, and
            // the sprintf-js DoS advisory was withdrawn. Add entries here only
            // with a documented rationale in AGENTS.md.
            const allowed = new Set([])
            const urls = new Set()
            for (const v of Object.values(report.vulnerabilities || {})) {
              for (const a of v.via || []) if (typeof a === 'object' && a.url) urls.add(a.url)
            }
            const blocking = [...urls].filter((u) => !allowed.has(u))
            if (blocking.length) {
              console.error('Blocking advisories: ' + blocking.join(', '))
              process.exit(1)
            }
            console.log('Audit OK (' + (urls.size || 'no') + ' advisory(ies), all allowlisted)')
          "
